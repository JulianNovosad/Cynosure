name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: powershell

jobs:
  test:
    runs-on: [self-hosted, gpu, windows]

    env:
      PYTHON: C:\Users\jumas\AppData\Local\Programs\Python\Python312\python.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          & $env:PYTHON -m pip install --upgrade pip
          & $env:PYTHON -m pip install torch
          & $env:PYTHON -m pip install -e .
          & $env:PYTHON -m pip install pytest

      - name: Run tests (GPU)
        run: |
          & $env:PYTHON -m pytest tests/ -v --ignore=tests/smoke_test.py
