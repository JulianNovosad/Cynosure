name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: powershell

jobs:
  test:
    runs-on: [self-hosted, gpu, windows]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install -e .
          pip install pytest

      - name: Run tests (GPU)
        run: |
          python -m pytest tests/ -v --ignore=tests/smoke_test.py
