<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Embedding Inspector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #00d4ff;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        input, select {
            padding: 8px 12px;
            background: #2a2f3f;
            border: 1px solid #00d4ff;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        button {
            padding: 8px 16px;
            background: #00d4ff;
            color: #0f1419;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #00f0ff;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .heatmap-container, .domains-container, .metrics-container {
            background: #1a1f2e;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .heatmap-title {
            color: #00d4ff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }

        .neuron {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            transition: all 0.1s;
            cursor: pointer;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .neuron:hover {
            transform: scale(1.2);
            border-color: #00d4ff;
        }

        .neuron-label {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }

        .domain {
            margin-bottom: 20px;
        }

        .domain-name {
            color: #00d4ff;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .domain-bars {
            display: flex;
            gap: 3px;
        }

        .bar {
            flex: 1;
            height: 30px;
            background: linear-gradient(to top, #00d4ff, #00f0ff);
            border-radius: 2px;
            opacity: 0.7;
            transition: opacity 0.1s;
        }

        .bar:hover {
            opacity: 1;
        }

        .reward-trace {
            height: 200px;
            background: #0f1419;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            margin-top: 15px;
        }

        .trace-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: #2a2f3f;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #00d4ff;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            color: #00d4ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Semantic Embedding Inspector</h1>

        <div class="controls">
            <label for="agentId">Agent ID:</label>
            <input type="number" id="agentId" value="0" min="0" max="10">
            <button onclick="updateAgent()">Load Agent</button>
            <span id="status" class="status">Loading...</span>
        </div>

        <div class="main-grid">
            <div class="heatmap-container">
                <div class="heatmap-title">57D Semantic State (Heatmap)</div>
                <div class="heatmap" id="heatmap"></div>
                <div class="status">Domain layout: 8 columns (8 neurons per domain)</div>
            </div>

            <div class="metrics-container">
                <div class="heatmap-title">Domain Summary</div>
                <div class="stats" id="domainStats"></div>
                <div class="reward-trace">
                    <canvas id="rewardCanvas" class="trace-canvas"></canvas>
                </div>
                <div class="status">Reward trace (last 500 ticks)</div>
            </div>
        </div>

        <div class="domains-container">
            <div class="heatmap-title">Per-Domain Breakdown</div>
            <div id="domains"></div>
        </div>
    </div>

    <script>
        const API_TOKEN = new URLSearchParams(window.location.search).get('token') ||
                         localStorage.getItem('visApiToken') || '';
        let rewardData = [];

        async function updateAgent() {
            const agentId = parseInt(document.getElementById('agentId').value);
            const statusEl = document.getElementById('status');

            try {
                statusEl.textContent = 'Loading semantic state...';

                const response = await fetch(`http://localhost:8080/semantic/${agentId}`, {
                    headers: { 'X-API-Token': API_TOKEN }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                displaySemanticState(data);
                updateRewardTrace(agentId);

                statusEl.textContent = `Tick: ${data.tick}`;
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        function displaySemanticState(data) {
            const state = data.semantic_state || [];

            // Create heatmap
            const heatmapEl = document.getElementById('heatmap');
            heatmapEl.innerHTML = '';

            const domainNames = ['Existence', 'Sensory', 'Cognitive', 'Strategic', 'Tactical', 'Social', 'Value', 'Meta'];
            const domainSizes = [8, 8, 8, 8, 8, 8, 2, 7];

            let idx = 0;
            domainNames.forEach((domainName, domainIdx) => {
                const domainSize = domainSizes[domainIdx];
                for (let i = 0; i < domainSize; i++) {
                    const value = state[idx] || 0;
                    const neuronEl = document.createElement('div');
                    neuronEl.className = 'neuron';
                    neuronEl.textContent = idx;
                    neuronEl.title = `${domainName}[${i}] = ${value.toFixed(2)}`;

                    // Heat color
                    const hue = (1 - value) * 240;
                    neuronEl.style.background = `hsl(${hue}, 100%, 50%)`;
                    neuronEl.style.opacity = Math.max(0.3, value);

                    heatmapEl.appendChild(neuronEl);
                    idx++;
                }
            });

            // Domain stats
            const domainStats = document.getElementById('domainStats');
            domainStats.innerHTML = '';
            idx = 0;
            domainNames.forEach((domainName, domainIdx) => {
                const domainSize = domainSizes[domainIdx];
                const domainValues = state.slice(idx, idx + domainSize);
                const mean = domainValues.reduce((a, b) => a + b, 0) / domainSize;
                const max = Math.max(...domainValues);
                const min = Math.min(...domainValues);

                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-label">${domainName}</div>
                    <div class="stat-value">${mean.toFixed(2)}</div>
                `;
                domainStats.appendChild(card);
                idx += domainSize;
            });

            // Detailed domain breakdown
            const domainsEl = document.getElementById('domains');
            domainsEl.innerHTML = '';
            idx = 0;
            domainNames.forEach((domainName, domainIdx) => {
                const domainSize = domainSizes[domainIdx];
                const domainValues = state.slice(idx, idx + domainSize);

                const domainDiv = document.createElement('div');
                domainDiv.className = 'domain';
                domainDiv.innerHTML = `
                    <div class="domain-name">${domainName}</div>
                    <div class="domain-bars">
                        ${domainValues.map((v, i) =>
                            `<div class="bar" style="height: ${30 + v * 100}px; background: hsl(${(1-v)*240}, 100%, 50%); opacity: ${Math.max(0.3, v)};"></div>`
                        ).join('')}
                    </div>
                `;
                domainsEl.appendChild(domainDiv);
                idx += domainSize;
            });
        }

        async function updateRewardTrace(agentId) {
            try {
                const response = await fetch(`http://localhost:8080/reward/${agentId}`, {
                    headers: { 'X-API-Token': API_TOKEN }
                });
                if (response.ok) {
                    const data = await response.json();
                    rewardData = data.reward_trace || [];
                    drawRewardTrace();
                }
            } catch (err) {
                console.error('Reward trace error:', err);
            }
        }

        function drawRewardTrace() {
            const canvas = document.getElementById('rewardCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = '#0f1419';
            ctx.fillRect(0, 0, width, height);

            if (rewardData.length === 0) return;

            const min = Math.min(...rewardData.map(d => d.reward));
            const max = Math.max(...rewardData.map(d => d.reward));
            const range = Math.max(Math.abs(max), Math.abs(min), 0.1);

            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 2;
            ctx.beginPath();

            rewardData.forEach((point, i) => {
                const x = (i / Math.max(1, rewardData.length - 1)) * width;
                const y = height / 2 - (point.reward / range) * (height / 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.stroke();

            // Draw zero line
            ctx.strokeStyle = '#444';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Poll for updates
        setInterval(() => {
            const agentId = parseInt(document.getElementById('agentId').value);
            updateAgent();
        }, 500);

        // Initial load
        updateAgent();
    </script>
</body>
</html>
